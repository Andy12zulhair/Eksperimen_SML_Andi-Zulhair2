name: Train and Log Model to DagsHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow dagshub seaborn matplotlib python-dotenv

      - name: Train model and log to DagsHub
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/Andy12zulhair/Submission_andizulhair.mlflow
          MLFLOW_TRACKING_USERNAME: Andy12zulhair
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          cd Membangun_model
          python modelling_tuning.py
